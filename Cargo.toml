[package]
name = "safeshell"
version = "0.1.0-alpha.2"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Approval-gated SSH broker for AI coding agents"

[dependencies]
age = "0.11.1"
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
interprocess = { version = "2.4.3", features = ["tokio"] }
keyring = "4.1.6"
regex = "1.11"
rmcp = { version = "3.1.0", features = ["transport-io"] }
rpassword = "7.4"
russh = "0.62.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
uuid = { version = "1.18", features = ["serde", "v4"] }
zeroize = { version = "1.8", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true
