name: Bug report
description: Report something that is broken or behaving incorrectly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        **Before you paste anything:** SafeHell sits between an agent and your
        servers, so its output can carry hostnames, usernames, and command
        history. Replace real hosts and accounts with placeholders, and never
        attach `audit.jsonl` or a vault file. If the bug *is* a credential leak
        or an approval bypass, close this and follow the
        [security policy](https://github.com/suiflex/SafeHell/security/policy)
        instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. safehell init
        2. safehell server add ...
        3. safehell exec <alias> -- <command>
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Approval broker (safehell serve)
        - Remote execution (exec, start, poll)
        - File transfer (get_file, put_file)
        - Vault, keyring, or setup
        - MCP server or agent integration
        - Installer or self-update
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: os-detail
    attributes:
      label: OS version / distro (optional)
      placeholder: e.g. macOS 15.2, Ubuntu 24.04, Windows 11

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - install.sh
        - install.ps1
        - Homebrew
        - Scoop
        - npm
        - cargo install
        - Built from source
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: SafeHell version
      description: Output of `safehell --version`.
    validations:
      required: true

  - type: dropdown
    id: agent
    attributes:
      label: Agent in use (optional)
      options:
        - Claude Code
        - Codex
        - Other
        - None, used directly

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: >-
        Error output only. Redact hostnames, usernames, and anything that looks
        like a secret before pasting.
      render: shell
