name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck -s sh scripts/install.sh tests/install_sh_test.sh
      - name: Installer script
        if: runner.os != 'Windows'
        run: sh tests/install_sh_test.sh
      # There is no shellcheck for PowerShell, but a parse error is the failure
      # mode that would otherwise reach users through `irm | iex`.
      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "scripts/install.ps1 parses cleanly"
      - name: Npm installer selftest
        run: node npm/install.js --selftest

