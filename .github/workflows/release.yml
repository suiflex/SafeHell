name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: safeshell-linux-x86_64
            extension: ""
          - os: ubuntu-24.04-arm
            asset: safeshell-linux-aarch64
            extension: ""
          - os: macos-13
            asset: safeshell-macos-x86_64
            extension: ""
          - os: macos-latest
            asset: safeshell-macos-aarch64
            extension: ""
          - os: windows-latest
            asset: safeshell-windows-x86_64.exe
            extension: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Stage binary
        shell: bash
        run: cp "target/release/safeshell${{ matrix.extension }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  # Publishes every asset together with SHA256SUMS in one release, so install.sh
  # never sees a release whose checksums have not been uploaded yet.
  publish:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: cd artifacts && sha256sum safeshell-* > SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
